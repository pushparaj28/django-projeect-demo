<!DOCTYPE html>
<html>
<head>
    <title>Student Form</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
           
          background-image: url("https://images.unsplash.com/photo-1476820865390-c52aeebb9891?q=80&w=870&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D");
            font-family: Arial, sans-serif;
        }

        .form-container{
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
            width: 350px;
        }

        h1{
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        label{
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"]{
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input[type="submit"]{
            width: 100%;
            padding: 10px;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        input[type="submit"]:hover{
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <div class="form-container">
        <h1>Student Registration College </h1>

        <form>
            <label>Name:</label>
            <input type="text" name="name">

            <label>Email:</label>
            <input type="email" name="email">

            <label>Phone:</label>
            <input type="text" name="phone">

            <input type="submit" value="Submit">
        </form>
    </div>

</body>
</html>
